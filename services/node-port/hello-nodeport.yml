apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: hello-rs
  namespace: learning
  labels:
    app: hello-kube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-kube
  template:
    metadata:
      labels:
        app: hello-kube
    spec:
      containers:
        - name: hello-kube
          image: 080196/hello-kube
          ports:
            - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: hello-nodeport
  namespace: learning
spec:
  type: NodePort
  selector:
    app: hello-kube
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30007